  path: any
  html: ^0.15.6
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  saver_gallery: ^4.0.1
  flutter_cache_manager: ^3.4.1
  image: ^4.5.4
  common_utils: ^2.1.0
  flutter_smart_dialog: ^4.9.8+9
